name: Build Galerie 1.1.2 test

on:
  push:
    branches:
      - agent/test-viewer-share-1.1.2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply 1.1.2 source changes
        run: |
          python3 tools/apply_1_1_2.py
          python3 tools/fix_1_1_2_generated.py
          git diff --check

      - name: Test and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Commit generated source
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app
            git commit -m "Implémenter le lecteur et le partage 1.1.2-test [skip ci]"
            git push origin HEAD:agent/test-viewer-share-1.1.2
          fi

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Galerie-1.1.2-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galerie-1.1.2-test
          path: Galerie-1.1.2-test.apk
          if-no-files-found: error
          retention-days: 14
