name: Build signed test APK

on:
  push:
    branches:
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lint --stacktrace

      - name: Restore permanent signing key
        env:
          GALLERY_KEYSTORE_BASE64: ${{ secrets.GALLERY_KEYSTORE_BASE64 }}
          GALLERY_KEYSTORE_PASSWORD: ${{ secrets.GALLERY_KEYSTORE_PASSWORD }}
          GALLERY_KEY_ALIAS: ${{ secrets.GALLERY_KEY_ALIAS }}
          GALLERY_KEY_PASSWORD: ${{ secrets.GALLERY_KEY_PASSWORD }}
          GALLERY_KEYSTORE_PATH: ${{ runner.temp }}/gallery-release.jks
        shell: bash
        run: |
          if [[ -z "$GALLERY_KEYSTORE_BASE64" || \
                -z "$GALLERY_KEYSTORE_PASSWORD" || \
                -z "$GALLERY_KEY_ALIAS" || \
                -z "$GALLERY_KEY_PASSWORD" ]]; then
            echo "The permanent Galerie signing secrets are missing." >&2
            exit 1
          fi
          printf '%s' "$GALLERY_KEYSTORE_BASE64" | base64 --decode > "$GALLERY_KEYSTORE_PATH"
          {
            echo "GALLERY_KEYSTORE_PATH=$GALLERY_KEYSTORE_PATH"
            echo "GALLERY_KEYSTORE_PASSWORD=$GALLERY_KEYSTORE_PASSWORD"
            echo "GALLERY_KEY_ALIAS=$GALLERY_KEY_ALIAS"
            echo "GALLERY_KEY_PASSWORD=$GALLERY_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble signed test APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare and verify APK
        id: apk
        shell: bash
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version_name" ]]; then
            echo "Unable to read versionName from app/build.gradle.kts." >&2
            exit 1
          fi
          apk_name="Galerie-${version_name}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_name"
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Galerie-${{ steps.apk.outputs.version_name }}
          path: |
            ${{ steps.apk.outputs.apk_name }}
            ${{ steps.apk.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 30
