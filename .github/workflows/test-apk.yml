name: Test APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply test source changes
        run: |
          if [[ -f tools/apply_1_1_2.py ]]; then
            python3 tools/apply_1_1_2.py
            python3 tools/fix_1_1_2_generated.py
          fi
          git diff --check

      - name: Test and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Galerie-1.1.2-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Galerie-1.1.2-test
          path: Galerie-1.1.2-test.apk
          if-no-files-found: error
          retention-days: 14
