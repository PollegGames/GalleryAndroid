name: Publish signed release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lint --stacktrace

      - name: Restore permanent signing key
        env:
          GALLERY_KEYSTORE_BASE64: ${{ secrets.GALLERY_KEYSTORE_BASE64 }}
          GALLERY_KEYSTORE_PASSWORD: ${{ secrets.GALLERY_KEYSTORE_PASSWORD }}
          GALLERY_KEY_ALIAS: ${{ secrets.GALLERY_KEY_ALIAS }}
          GALLERY_KEY_PASSWORD: ${{ secrets.GALLERY_KEY_PASSWORD }}
          GALLERY_KEYSTORE_PATH: ${{ runner.temp }}/gallery-release.jks
        shell: bash
        run: |
          if [[ -z "$GALLERY_KEYSTORE_BASE64" || \
                -z "$GALLERY_KEYSTORE_PASSWORD" || \
                -z "$GALLERY_KEY_ALIAS" || \
                -z "$GALLERY_KEY_PASSWORD" ]]; then
            echo "The permanent Galerie signing secrets are missing." >&2
            exit 1
          fi
          printf '%s' "$GALLERY_KEYSTORE_BASE64" | base64 --decode > "$GALLERY_KEYSTORE_PATH"
          {
            echo "GALLERY_KEYSTORE_PATH=$GALLERY_KEYSTORE_PATH"
            echo "GALLERY_KEYSTORE_PASSWORD=$GALLERY_KEYSTORE_PASSWORD"
            echo "GALLERY_KEY_ALIAS=$GALLERY_KEY_ALIAS"
            echo "GALLERY_KEY_PASSWORD=$GALLERY_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$version_name" || "$version_name" == *-test* ]]; then
            echo "A release tag requires a final versionName." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version_name}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version_name." >&2
            exit 1
          fi
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Assemble signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare and verify APK
        id: apk
        shell: bash
        run: |
          apk_name="Galerie-${{ steps.version.outputs.version_name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk_name"
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs "$apk_name"
          sha256sum "$apk_name" > "${apk_name}.sha256"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Galerie-${{ steps.version.outputs.version_name }}
          path: |
            ${{ steps.apk.outputs.apk_name }}
            ${{ steps.apk.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "${{ steps.apk.outputs.apk_name }}" \
              "${{ steps.apk.outputs.apk_name }}.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.apk.outputs.apk_name }}" \
              "${{ steps.apk.outputs.apk_name }}.sha256" \
              --title "Galerie ${{ steps.version.outputs.version_name }}" \
              --generate-notes
          fi
